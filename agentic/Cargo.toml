[package]
name = "devagentics"
version = "0.1.0"
edition = "2024"
# edition 2024 needs 1.85; devws checks this before building (agentic_install.sh).
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
globset = "0.4.21"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
