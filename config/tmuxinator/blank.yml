# An empty workspace (devws menu › Templates › New empty workspace): the
# sidebar and one shell, on the folder (root=) and under the name (name=)
# given. Split it and run what you like in its panes; Templates › Save as
# template then keeps it as a template of your own (workspace_template.sh).
# The sidebar lists it as "template · <its template>" (@devws_agent and
# @devws_editor), which also keeps every field of its saved line
# (save_state.sh reads them tab-separated).
name: <%= @settings["name"] %>
root: <%= @settings["root"] %>

# Single-quoted, as dev.yml's: YAML would read " #{E:..." as a comment.
pre_window: 'tmux set-option status-position top; tmux set-option status-left-length 40; tmux set-option status-left "[#{s/^dev-//:session_name}]"; tmux set-option @devws_agent template; tmux set-option @devws_editor blank; tmux set-option @devws_template blank; tmux set-option @devws_root "$PWD"; tmux set-option -w pane-border-indicators off; tmux set-option -w pane-border-status top; tmux set-option -w @devws_main 1; clear'

windows:
  - workspace:
      # The sidebar at 25 columns, the shell across the rest.
      layout: "22a6,200x50,0,0{25x50,0,0,0,174x50,26,0,1}"
      panes:
        - picker: ~/.tmuxinator/session_picker.sh
        - terminal: tmux set-option -p -t "$TMUX_PANE" @devws_role terminal; clear
