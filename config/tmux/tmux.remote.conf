# Over SSH (tmux.conf loads this when SSH_CLIENT is set).

# Set port of SSH remote tunnel, where tmux will pipe buffers to transfer on local machine for copy
set -g @copy_backend_remote_tunnel_port 11988

# Nested in a local tmux (the terminal it was started from says tmux-* or
# screen-*): a one-line status bar at the bottom, so it does not stack with
# the local session's, and the three-line devws header stays the local one's.
# devws run straight over SSH, from a plain terminal, keeps its header. The
# terminal's TERM is in tmux's global environment: the shell if-shell runs
# has tmux's own (tmux-256color) instead.
if-shell 'case "$(tmux show-environment -g TERM 2>/dev/null)" in TERM=tmux*|TERM=screen*) exit 0 ;; *) exit 1 ;; esac' {
  set -g status-position bottom
  set -g status on

  # In remote mode we don't show "clock" and "battery status" widgets
  set -g status-left "$wg_session"
  set -g status-right "#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | $wg_user_host | #{online_status}"
}
