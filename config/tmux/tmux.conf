# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "tmux-256color"
# Report modified keys to programs that ask for them. Not "always": that
# forces modifyOtherKeys mode 1 on programs that never requested it, and mode 1
# cannot carry Shift+Enter anyway because Enter already has a well-known
# representation. Shift+Enter is made distinguishable in iTerm2 itself, by
# scripts/setup_iterm_keys.sh.
set -s extended-keys on
set -as terminal-features '*:extkeys'
set -g extended-keys-format csi-u
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
# Lets the editor reload files an agent changed as soon as its pane is focused.
set -g focus-events on
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix C-a

# Set parent terminal title to reflect current window in tmux session 
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on


# ==========================
# ===   Key bindings     ===
# ==========================

# Unbind default key bindings, we're going to override
unbind "\$" # rename-session
unbind ,    # rename-window
unbind %    # split-window -h
unbind '"'  # split-window
#unbind }    # swap-pane -D
#unbind {    # swap-pane -U
unbind [    # paste-buffer
unbind ]    
unbind "'"  # select-window
unbind n    # next-window
unbind p    # previous-window
unbind l    # last-window
unbind M-n  # next window with alert
unbind M-p  # next window with alert
unbind o    # focus thru panes
unbind &    # kill-window
unbind "#"  # list-buffer 
unbind =    # choose-buffer
unbind z    # zoom-pane
unbind M-Up  # resize 5 rows up
unbind M-Down # resize 5 rows down
unbind M-Right # resize 5 rows right
unbind M-Left # resize 5 rows left


# Edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration 
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"

# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Persist the open devws workspaces so they can be restored after a reboot or a
# crash. Backgrounded so the tmux server never waits on the snapshot.
set-hook -g session-created 'run-shell -b "~/.tmuxinator/save_state.sh"'
set-hook -g session-closed  'run-shell -b "~/.tmuxinator/save_state.sh"'
set-hook -g client-detached 'run-shell -b "~/.tmuxinator/save_state.sh"'
set-hook -g pane-exited     'run-shell -b "~/.tmuxinator/save_state.sh"'

# Rename session and window
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Select pane and windows
bind -r C-[ previous-window
bind -r C-] next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

# Zoom pane
bind + resize-pane -Z

# Link window
bind L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
#bind \ if '[ #{pane_index} -eq 1 ]' \
#     'swap-pane -s "!"' \
#     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Kill pane/window/session shortcuts
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind C-u command-prompt -p "Session to merge with: " \
   "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# Detach from session
bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Hide status bar on demand
bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'



# ==================================================
# === Window monitoring for activity and silence ===
# ==================================================
bind m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'

# Activity bell and whistles
set -g visual-activity on

# TODO: Does not work as well, check on newer versions
# set -g visual-silence on

# BUG: bell-action other ignored · Issue #1027 · tmux/tmux · GitHub - https://github.com/tmux/tmux/issues/1027
# set -g visual-bell on
# setw -g bell-action other

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================
set -g @copy_use_osc52_fallback on

# Prefer vi style key table
setw -g mode-keys vi

bind p paste-buffer
bind C-p choose-buffer

# trigger copy mode by
bind -n M-Up copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# wrap default shell in reattach-to-user-namespace if available
# there is some hack with `exec & reattach`, credits to "https://github.com/gpakosz/.tmux"
# don't really understand how it works, but at least window are not renamed to "reattach-to-user-namespace"
if -b "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    "run 'tmux set -g default-command \"exec $(tmux show -gv default-shell) 2>/dev/null & reattach-to-user-namespace -l $(tmux show -gv default-shell)\"'"

yank="~/.tmux/yank.sh"

# Copy selected text
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi Y send-keys -X copy-line \;\
    run "tmux save-buffer - | $yank"
bind-key -T copy-mode-vi D send-keys -X copy-end-of-line \;\
    run "tmux save-buffer - | $yank"
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "$yank"
bind-key -T copy-mode-vi A send-keys -X append-selection-and-cancel \;\
    run "tmux save-buffer - | $yank"

# Copy selection on drag end event, but do not cancel copy mode and do not clear selection
# clear select on subsequence mouse click
bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe "$yank"
bind -T copy-mode-vi MouseDown1Pane select-pane \;\
   send-keys -X clear-selection
    
# iTerm2 works with clipboard out of the box, set-clipboard already set to "external"
# tmux show-options -g -s set-clipboard
# set-clipboard on|external

# =====================================
# ===           Theme               ===
# =====================================

# Feel free to NOT use this variables at all (remove, rename)
# this are named colors, just for convenience
color_orange="colour166" # 208, 166
color_purple="colour134" # 135, 134
color_green="colour076" # 070
color_blue="colour39"
color_yellow="colour220"
color_red="colour160"
color_black="colour232"
color_white="white" # 015

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="colour245"
color_main="$color_orange"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="colour238"
color_window_off_status_current_bg="colour254"

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=$color_dark"

# window segments in status line
set -g window-status-separator ""
separator_powerline_left=""
separator_powerline_right=""

# setw -g window-status-style "fg=$color_status_text,bg=$color_dark"
# The hidden window holding minimized devws panes is left out of the list.
setw -g window-status-format "#{?#{==:#{window_name},devws-minimized},, #I:#W }"
setw -g window-status-current-style "fg=$color_light,bold,bg=$color_main"
setw -g window-status-current-format "#[fg=$color_dark,bg=$color_main]$separator_powerline_right#[default] #I:#W# #[fg=$color_main,bg=$color_dark]$separator_powerline_right#[default]"

# when window has monitoring notification
setw -g window-status-activity-style "fg=$color_main"

# outline for active pane
setw -g pane-active-border-style "fg=$color_main"

# general status bar settings: five lines (tmux's most), the devws header (see
# below); one while it is hidden (header_toggle.sh), across reloads too
set -g @devws_header_lines 5
set -g status 5
if -F '#{@devws_header_hidden}' 'set -g status on'
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-right-length 100

# define widgets we're going to use in status bar
# note, that this is not the complete list, some of them are loaded from plugins
wg_session="#[fg=$color_session_text] #S #[default]"
wg_battery="#{battery_status_fg} #{battery_icon} #{battery_percentage}"
wg_date="#[fg=$color_light,bold]%H:%M#[nobold] #[fg=$color_secondary]%a %d %b#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
# TODO: highlighted for nested local session as well
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-left "$wg_session"
# This workspace's conversation (header_ticker.sh): its tokens and context.
wg_conversation="#{?#{@devws_agent_session_usage},#[fg=$color_status_text]#{@devws_agent_session_usage}#[default]   ,}"
# ▾ hides the header's rows, ▸ brings them back (header_toggle.sh): clicked,
# like a pane's header, through the devws-header range (MouseDown1Status).
wg_header_toggle="#[range=user|devws-header fg=$color_status_text] #{?#{@devws_header_hidden},▸,▾} #[norange default]"
set -g status-right "#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed $wg_conversation$wg_date $wg_header_toggle"

# The devws header: under tmux's own line (session, windows, clock) and a blank
# line, three rows of groups — the system, a column per agent, the weather —
# and the ghost. tmux can only align a line left, centre or right, so
# header_ticker.sh lays the rows out at each client's width (header_layout.sh)
# and these lines only show them; the ghost, which moves 20 times a second, has
# its own options at the right edge, left out under 110 columns.
# A click anywhere on the rows or the ghost hides them too. Each alignment has
# its own devws-header range: one carried across #[align=right] stops working
# on the left part.
wg_ghost_1="#{?#{e|<:#{client_width},110},,#[align=right range=user|devws-header]#{@devws_ghost_1} #[norange]}"
wg_ghost_2="#{?#{e|<:#{client_width},110},,#[align=right range=user|devws-header]#{@devws_ghost_2} #[norange]}"
wg_ghost_3="#{?#{e|<:#{client_width},110},,#[align=right range=user|devws-header]#{@devws_ghost_3} #[norange]}"
set -g status-format[1] ""
set -g status-format[2] "#[range=user|devws-header]#{@devws_header_row_1}#[norange]$wg_ghost_1"
set -g status-format[3] "#[range=user|devws-header]#{@devws_header_row_2}#[norange]$wg_ghost_2"
set -g status-format[4] "#[range=user|devws-header]#{@devws_header_row_3}#[norange]$wg_ghost_3"
# The bars in the terminal's own green, yellow and red, as Claude Code's
# status line draws them.
set -g @devws_color_ok "green"
set -g @devws_color_warn "yellow"
set -g @devws_color_stress "red"
set -g @devws_color_dim "$color_status_text"
set -g @devws_color_rule "colour238"
# The ghost in Claude Code's orange while it works.
set -g @devws_color_ghost "colour173"
run-shell -b '~/.tmuxinator/header_ticker.sh --start'

# online and offline icon for tmux-online-status
set -g @online_icon "#[fg=$color_level_ok]●#[default]"
set -g @offline_icon "#[fg=$color_level_stress]●#[default]"

# Configure view templates for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_mem_view_tmpl 'MEM:#[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"


# Configure tmux-battery widget colors
set -g @batt_color_full_charge "#[fg=$color_level_ok]"
set -g @batt_color_high_charge "#[fg=$color_level_ok]"
set -g @batt_color_medium_charge "#[fg=$color_level_warn]"
set -g @batt_color_low_charge "#[fg=$color_level_stress]"

# Configure tmux-prefix-highlight colors
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "$color_dark"
set -g @prefix_highlight_bg "$color_secondary"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$color_dark,bg=$color_secondary"


# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind '$' run "~/.tmux/renew_env.sh"


# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# Plugin properties
set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'

set -g @open-S 'https://www.google.com/search?q='


# ==============================================
# ===   Nesting local and remote sessions     ===
# ==============================================

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# We want to have single prefix key "C-a", usable both for local and remote session
# we don't want to "C-a" + "a" approach either
# Idea is to turn off all key bindings and prefix handling on local session,
# so that all keystrokes are passed to inner/remote session

# see: toggle on/off all keybindings · Issue #237 · tmux/tmux - https://github.com/tmux/tmux/issues/237

# Also, change some visual styles when window keys are off
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
    set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'

# Reset key bindings to tmux defaults (keeps styling/status bar above).
# Loaded last so it overrides oh-my-tmux's custom shortcuts.
# Remove this line (and default-keys.conf) to restore oh-my-tmux shortcuts.
source-file ~/.tmux/default-keys.conf

# devws bindings go after the reset above, which wipes every custom binding.
# The devws menu: every workspace action, in tabs (devws_menu.sh). Replaces
# tmux's "next layout"; devws switches layouts with C-b \ instead.
bind Space run-shell -b "~/.tmuxinator/devws_menu.sh --popup '#{client_name}'"
# Flip a devws workspace between editor-on-top and full-height-editor layouts.
bind '\' run-shell -b "~/.tmuxinator/toggle_layout.sh '#{session_name}'"

# The agent's state in a devws workspace (agent_status.sh, set by the agents'
# hooks): a spinner while it works, ● when a prompt needs you, ✓ when it is
# done; nothing while idle. The icon alone fits the minimized strip and the
# status bar; in the agent's header the spinner takes the agent icon's place
# and the badge names the other states.
set -g @devws_agent_icon "#{?#{==:#{@devws_agent_state},working},#{?#{@devws_agent_frame},#{@devws_agent_frame},⠋},#{?#{==:#{@devws_agent_state},waiting},#[fg=$color_level_warn]●#[fg=default],#{?#{==:#{@devws_agent_state},done},#[fg=$color_level_ok]✓#[fg=default],}}}"
set -g @devws_agent_badge "#{?#{==:#{@devws_agent_state},waiting},#[fg=$color_level_warn]● needs you#[fg=default],#{?#{==:#{@devws_agent_state},done},#[fg=$color_level_ok]✓ done#[fg=default],}}"

# devws workspaces (dev.yml) turn on pane-border-status, which makes this a
# header above each pane. Agent, terminal and database panes get an icon and
# label (▾); while minimize_panes.sh has swapped in placeholders (role
# minimized-*), a bare "▸ Agent" / "▸ Term" / "▸ DB" with no icon or padding,
# so the strip stays as narrow as possible. Other panes get a blank header.
# The agent's header shows its state (the spinner as its icon, or
# @devws_agent_badge) and names the follow mode (follow_mode.sh) while Neovim
# is linked; the minimized strip, the state icon.
set -g pane-border-format "#{?#{m/r:^(agent|terminal|extra|database)$,#{@devws_role}},#{?pane_active,#[bold],} ▾ #{?#{==:#{@devws_role},agent},#{?#{==:#{@devws_agent_state},working},#{E:@devws_agent_icon},\U000F06A9} Agent · #{@devws_agent}#{?#{m/r:^(waiting|done)$,#{@devws_agent_state}}, #{E:@devws_agent_badge},}#{?#{@devws_editor_socket},#{?#{==:#{@devws_follow},off},,#{?#{==:#{@devws_follow},notify}, · notify,#{?#{==:#{@devws_follow},focus}, · following + focus,#{?#{==:#{@devws_follow},explore}, · following reads, · following}}}},},#{?#{==:#{@devws_role},database},\U000F01BC Database · #{@devws_db_kind}, Terminal}} ,#{?#{m/r:^minimized-,#{@devws_role}},▸ #{?#{==:#{@devws_role},minimized-agent},Agent#{?#{@devws_agent_state}, #{E:@devws_agent_icon},},#{?#{==:#{@devws_role},minimized-database},DB,Term}},}}"

# Clicking a header minimizes or restores its group: the database on its own,
# or the agent and terminals together. Bound to the release so pressing a
# border still starts a drag-resize; a drag ends with MouseDragEnd1Border
# instead and does not toggle.
bind -n MouseUp1Border {
  if -F -t = "#{m/r:^(minimized-)?database$,#{@devws_role}}" {
    run-shell -b "~/.tmuxinator/minimize_panes.sh '#{session_name}' toggle database"
  } {
    if -F -t = "#{m/r:^(minimized-)?(agent|terminal|extra)$,#{@devws_role}}" {
      run-shell -b "~/.tmuxinator/minimize_panes.sh '#{session_name}' toggle agents"
    }
  }
}
bind _ run-shell -b "~/.tmuxinator/minimize_panes.sh '#{session_name}' toggle agents"
# The header hides the same way: a click on its rows or on ▾ / ▸ (the
# devws-header range), or C-b C-s. Any other click on the status bar keeps
# tmux's own meaning, choosing a window.
bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},devws-header}" {
    run-shell -b "~/.tmuxinator/header_toggle.sh"
  } {
    switch-client -t =
  }
}
bind C-s run-shell -b "~/.tmuxinator/header_toggle.sh"
# Open the project's database beside the editor, or focus it when open.
bind B run-shell -b "~/.tmuxinator/open_database.sh '#{session_name}'"
# Choose how the editor follows the agent: a menu of the follow modes.
bind F run-shell -b "~/.tmuxinator/follow_mode.sh '#{session_name}'"
