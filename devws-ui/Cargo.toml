[package]
name = "devws-ui"
version = "0.1.0"
edition = "2024"
# edition 2024 needs 1.85; devws checks this before building (rust_tools.sh).
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# ratatui's own crossterm, with keys read from /dev/tty by poll(): macOS's
# kqueue cannot watch a tty, so the default reader fails when stdin is a pipe.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
